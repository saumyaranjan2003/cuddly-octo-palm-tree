<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4 text-center">Kanban Board</h1>
    <div class="row" id="kanban-board">
      <div class="col-md-4">
        <div class="card">
          <div class="card-header bg-primary text-white">To Do</div>
          <div class="card-body kanban-column" id="todo"></div>
          <div class="card-footer">
            <button class="btn btn-sm btn-success w-100" onclick="showAddTaskModal('todo')">Add Task</button>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-header bg-warning text-dark">In Progress</div>
          <div class="card-body kanban-column" id="inprogress"></div>
          <div class="card-footer">
            <button class="btn btn-sm btn-success w-100" onclick="showAddTaskModal('inprogress')">Add Task</button>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-header bg-success text-white">Done</div>
          <div class="card-body kanban-column" id="done"></div>
          <div class="card-footer">
            <button class="btn btn-sm btn-success w-100" onclick="showAddTaskModal('done')">Add Task</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Task Modal -->
  <div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addTaskModalLabel">Add Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="taskTitle" class="form-control" placeholder="Task title">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="addTaskBtn">Add</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
